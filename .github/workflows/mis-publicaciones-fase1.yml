name: Mi Contacto fase 1 - verificacion ligera
on:
  push:
    branches:
      - feature/mis-publicaciones-real-fase1
  pull_request:
    branches:
      - work/admin-codes-excel-20261110
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Comprobar sintaxis de archivos modificados
        run: |
          node --check views.js
          node --check dashboard.js
          node --check tests/account-publications-layout.test.mjs
          node --check tests/multiple-publications-contract.test.mjs
          node --check tests/featured-publication-selection.test.mjs
          node --check tests/multiple-publications-backend-contract.test.mjs
          node --check tests/multiple-publications-api-contract.test.mjs
          node --check tests/multiple-publications-link-uniqueness.test.mjs
          node --check tests/multiple-publications-edit-isolation.test.mjs
      - name: Probar estructura y creación múltiple
        run: node --test tests/account-publications-layout.test.mjs tests/multiple-publications-contract.test.mjs tests/featured-publication-selection.test.mjs tests/multiple-publications-backend-contract.test.mjs tests/multiple-publications-api-contract.test.mjs tests/multiple-publications-link-uniqueness.test.mjs tests/multiple-publications-edit-isolation.test.mjs tests/multi-country-account.test.mjs tests/profile-service.test.mjs tests/profile-postgres.test.mjs

  migration-isolated:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Instalar dependencias fijadas
        run: npm ci --ignore-scripts
      - name: Probar migración con PostgreSQL aislado PGlite
        run: node --test tests/multiple-publications-migration-integration.test.mjs

  migration-native:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Instalar dependencias fijadas
        run: npm ci --ignore-scripts
      - name: Instalar PostgreSQL nativo aislado
        run: sudo apt-get update && sudo apt-get install -y postgresql-16
      - name: Verificar migración 020 en clúster PostgreSQL descartable
        env:
          MC_NATIVE_PG_BIN: /usr/lib/postgresql/16/bin
        run: node --test tests/multiple-publications-native-postgres.test.mjs
